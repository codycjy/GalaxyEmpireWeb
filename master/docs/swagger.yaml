            $ref: '#/definitions/account.accountResponse'
        "400":
          description: Bad Request with error message
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete Account
      tags:
      - account
    post:
      consumes:
      - application/json
      description: Create Account
      parameters:
      - description: Account
        in: body
        name: account
        required: true
        schema:
